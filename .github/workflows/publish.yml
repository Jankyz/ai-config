name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install the pinned npm CLI
        run: npm install --global npm@11.16.0
      - name: Verify release identity and npm CLI
        run: |
          actual="$(npm --version)"
          test "$actual" = "11.16.0"
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const pkg = JSON.parse(readFileSync("package.json", "utf8")); const tag = process.env.RELEASE_TAG; const validVersion = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(pkg.version); if (process.env.GITHUB_REPOSITORY !== "Jankyz/ai-config") throw new Error(`unexpected repository ${process.env.GITHUB_REPOSITORY}`); if (pkg.name !== "@jankyz/ai-config") throw new Error(`unexpected package ${pkg.name}`); if (!validVersion) throw new Error(`invalid package version ${pkg.version}`); if (tag !== `v${pkg.version}`) throw new Error(`release tag ${tag} does not match package version v${pkg.version}`);'
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - run: npm run check
      - run: npm run pack:check
      - run: git diff --check
      - name: Check whether the exact package version is already published
        id: registry
        run: |
          package_name="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; console.log(JSON.parse(readFileSync("package.json", "utf8")).name);')"
          package_version="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; console.log(JSON.parse(readFileSync("package.json", "utf8")).version);')"
          set +e
          node scripts/npm-version-status.mjs "$package_name" "$package_version"
          status=$?
          set -e
          case "$status" in
            0) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            10) echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "REGISTRY_CHECK_FAILED ${package_name}@${package_version}: status ${status}" >&2
              exit "$status"
              ;;
          esac
      - if: steps.registry.outputs.publish == 'true'
        run: npm publish
