name: Prepare GitHub release draft

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-draft-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-draft:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install the pinned npm CLI
        run: npm install --global npm@11.16.0
      - name: Verify release candidate identity and npm CLI
        run: |
          actual="$(npm --version)"
          test "$actual" = "11.16.0"
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const pkg = JSON.parse(readFileSync("package.json", "utf8")); const tag = process.env.RELEASE_TAG; const validVersion = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(pkg.version); if (process.env.GITHUB_REPOSITORY !== "Jankyz/ai-config") throw new Error(`unexpected repository ${process.env.GITHUB_REPOSITORY}`); if (pkg.name !== "@jankyz/ai-config") throw new Error(`unexpected package ${pkg.name}`); if (!validVersion) throw new Error(`invalid package version ${pkg.version}`); if (tag !== `v${pkg.version}`) throw new Error(`tag ${tag} does not match package version v${pkg.version}`);'
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - run: npm run check
      - run: npm run pack:check
      - run: git diff --check
      - name: Create a draft release when none exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_state="$(gh release list --limit 1000 --json tagName,isDraft | node --input-type=module -e 'import { readFileSync } from "node:fs"; const releases = JSON.parse(readFileSync(0, "utf8")); const tag = process.env.RELEASE_TAG; if (!Array.isArray(releases)) throw new Error("invalid release lookup result"); const matching = releases.filter((release) => release.tagName === tag); if (matching.length === 0) { console.log("missing"); } else if (matching.length !== 1) { throw new Error("ambiguous release lookup for " + tag); } else if (typeof matching[0].isDraft !== "boolean") { throw new Error("invalid release lookup result for " + tag); } else { console.log(matching[0].isDraft ? "draft" : "published"); }')"
          case "$release_state" in
            missing)
              ;;
            draft)
              echo "RELEASE_DRAFT_ALREADY_EXISTS ${RELEASE_TAG}"
              exit 0
              ;;
            published)
              echo "RELEASE_ALREADY_PUBLISHED ${RELEASE_TAG}"
              exit 0
              ;;
            *)
              echo "Unexpected release lookup state: $release_state" >&2
              exit 1
              ;;
          esac
          version="${RELEASE_TAG#v}"
          preamble="$(printf '## Install\n\nPreview:\n```bash\nnpx @jankyz/ai-config setup --provider codex\n```\n\nApply:\n```bash\nnpx @jankyz/ai-config setup --provider codex --apply\n```\n\nPackage: @jankyz/ai-config@%s\n' "$version")"
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes --notes "$preamble"
